name: Build APK

on:
  push:
    branches: [ main, 'ui-*', 'dev-*' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Forks deploy the web app without the upstream Android signing secrets.
    if: github.repository == 'shunzhe1121/river-runner' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      # VERSION_NAME is set by the "Version and notes from CHANGELOG.md" step.
      # Signing material is restored from secrets below and shredded afterwards.
      RR_KEYSTORE_PATH: keystore/release.p12
      RR_STORE_PASSWORD: ${{ secrets.RR_STORE_PASSWORD }}
      RR_KEY_ALIAS: ${{ secrets.RR_KEY_ALIAS }}
      RR_KEY_PASSWORD: ${{ secrets.RR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # The top "## X.Y" heading of CHANGELOG.md is the version line: builds are X.Y.<run number>.
      # A v* tag uses the tag name. The top section becomes the release notes.
      - name: Version and notes from CHANGELOG.md
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="$GITHUB_REF_NAME"
          else
            base=$(grep -m1 -E '^## [0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+).*/\1/')
            if [ -z "$base" ]; then
              echo "::error::CHANGELOG.md needs a '## X.Y' heading at the top"
              exit 1
            fi
            v="${base}.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
          echo "version $v"; cat release-notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests
        run: |
          # Retry only when Gradle could not download a plugin or dependency (network).
          set +e
          for attempt in 1 2 3; do
            ./gradlew :engine:jvmTest --no-daemon 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && break
            grep -qE "was not found in any of the following sources|Could not resolve|Could not GET|Could not HEAD|Connection reset|Read timed out|Connect timed out" build.log || break
            echo "::warning::Gradle download failed, retrying (attempt $attempt)"
            sleep 20
          done
          exit $status

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          RR_KEYSTORE_BASE64: ${{ secrets.RR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RR_KEYSTORE_BASE64" ]; then
            echo "::error::Signing key not configured. Add the RR_KEYSTORE_BASE64 secret (base64 of keystore/release.p12)."
            exit 1
          fi
          mkdir -p "$(dirname "$RR_KEYSTORE_PATH")"
          printf '%s' "$RR_KEYSTORE_BASE64" | base64 -d > "$RR_KEYSTORE_PATH"
          echo "signing key restored: $(wc -c < "$RR_KEYSTORE_PATH") bytes"

      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: |
          # Retry only when Gradle could not download a plugin or dependency (network), never on a real
          # compile or test failure. (Actions runs bash with -e and pipefail, which would stop at the first failure.)
          set +e
          for attempt in 1 2 3; do
            ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && break
            grep -qE "was not found in any of the following sources|Could not resolve|Could not GET|Could not HEAD|Connection reset|Read timed out|Connect timed out" build.log || break
            echo "::warning::Gradle download failed, retrying (attempt $attempt)"
            sleep 20
          done
          exit $status

      - name: Shred signing key
        if: always()
        run: rm -f "$RR_KEYSTORE_PATH"

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          grep -E "^e: |What went wrong|Could not|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ && cd /tmp/logs && echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b ci-logs && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "build log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk river-runner-${VERSION_NAME}.apk

      - name: Print signer certificate
        if: github.event_name != 'pull_request'
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs river-runner-*.apk | tee signer.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: river-runner-apk
          path: river-runner-*.apk

      # Every build of main is its own release (v0.7.76, v0.7.77, ...) and is kept, so GitHub's
      # download counts add up instead of starting from zero with each build. The newest one is
      # marked "latest", so https://github.com/<repo>/releases/latest always opens it.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CERT=$(grep -m1 "SHA-256 digest" signer.txt | sed 's/.*digest: //')
          TAG="v${VERSION_NAME}"
          # downloads of every release so far (the new one starts at 0)
          TOTAL=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" -q '[.[].assets[].download_count] | add // 0' | awk '{s+=$1} END {print s+0}')
          {
            cat release-notes.md
            echo
            echo "---"
            echo
            echo "Automatic build of ${GITHUB_SHA::7}. Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
            echo
            echo "累计下载（此前所有版本）/ Downloads of all earlier releases: ${TOTAL}"
            echo
            echo "**签名密钥已在 0.3.0 更换**：从 0.2.x 升级请先卸载旧版本再安装，签名不同无法直接覆盖。"
            echo
            echo "Signing key changed at 0.3.0: uninstall the 0.2.x build before installing this one."
            echo
            echo "Signer certificate SHA-256: ${CERT}"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run of the same build: replace the file, keep the release
            gh release upload "$TAG" river-runner-*.apk --clobber
          else
            gh release create "$TAG" river-runner-*.apk --target "$GITHUB_SHA" --latest \
              --title "River Runner ${VERSION_NAME}" --notes-file notes.md
          fi
          # The old rolling "latest" release (before 0.7.76) is kept for its download count;
          # its text points to the current release.
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Old rolling build, no longer updated" --notes "**这个发布已停止更新。**最新版请到：https://github.com/${GITHUB_REPOSITORY}/releases/latest

          This rolling release is no longer updated; every build now has its own release so download counts add up. Latest version: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" river-runner-*.apk --title "${GITHUB_REF_NAME}" --notes-file release-notes.md

  screenshots:
    # Renders the UI on the JVM (Robolectric + Roborazzi) and publishes the PNGs to the
    # "screenshots" branch, so layout changes can be reviewed without a device.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'shunzhe1121/river-runner'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          # Retry only when Gradle could not download a plugin or dependency (network), never on a real
          # compile or test failure. (Actions runs bash with -e and pipefail, which would stop at the first failure.)
          set +e
          for attempt in 1 2 3; do
            ./gradlew :app:recordRoborazziDebug --no-daemon 2>&1 | tee render.log
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && break
            grep -qE "was not found in any of the following sources|Could not resolve|Could not GET|Could not HEAD|Connection reset|Read timed out|Connect timed out" render.log || break
            echo "::warning::Gradle download failed, retrying (attempt $attempt)"
            sleep 20
          done
          exit $status

      - name: Report render errors
        if: failure()
        run: |
          touch render.log
          grep -E "^e: |What went wrong|FAILED|Exception" -A3 render.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Publish to screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/shots
          cp app/build/screenshots/*.png /tmp/shots/ 2>/dev/null || true
          cp render.log /tmp/shots/ 2>/dev/null || true
          if [ -d app/build/reports/tests/testDebugUnitTest ]; then cp -r app/build/reports/tests/testDebugUnitTest /tmp/shots/test-report; fi
          cd /tmp/shots
          echo "${GITHUB_SHA}" > COMMIT
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  # Web version (iPhone and other browsers): Wasm build with a JS fallback for older browsers.
  # The log always goes to the web-logs branch; a successful build is published to gh-pages,
  # which GitHub Pages serves at https://<owner>.github.io/<repo>/.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web app
        run: |
          # Retry only when a download failed (network), never on a real compile failure.
          # (Actions runs bash with -e and pipefail, which would stop at the first failure.)
          set +e
          for attempt in 1 2 3; do
            ./gradlew :web:composeCompatibilityBrowserDistribution --no-daemon 2>&1 | tee web.log
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && break
            grep -qE "was not found in any of the following sources|Could not resolve|Could not GET|Could not HEAD|Connection reset|Read timed out|Connect timed out" web.log || break
            echo "::warning::Gradle download failed, retrying (attempt $attempt)"
            sleep 20
          done
          exit $status

      - name: Report web build errors
        if: failure()
        run: |
          touch web.log
          grep -E "^e: |What went wrong|Could not|error:" -A3 web.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Publish log to web-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/weblog
          cp web.log /tmp/weblog/ 2>/dev/null || touch /tmp/weblog/web.log
          # where the distributions ended up, to check the publish step
          find web/build/dist -maxdepth 3 -type d > /tmp/weblog/dist-dirs.txt 2>/dev/null || true
          cd /tmp/weblog
          echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b web-logs && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "web log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-logs

      - name: Publish to gh-pages
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev-web'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist=$(find web/build/dist -type d -path "*omposeWebCompatibility*" -name productionExecutable | head -1)
          [ -n "$dist" ] || dist=$(dirname "$(grep -rl --include=index.html riverRunner.js web/build/dist | head -1)")
          echo "publishing $dist"
          ls -la "$dist"
          mkdir -p /tmp/site && cp -r "$dist"/. /tmp/site/
          cd /tmp/site
          # source maps are for debugging only (the two copies of skiko.wasm are both referenced)
          rm -f ./*.map
          # a new id per deploy makes browsers install the new offline cache (see sw.js)
          sed -i "s/__RR_BUILD__/${GITHUB_SHA::12}/" sw.js
          grep -q "${GITHUB_SHA::12}" sw.js || { echo "::error::sw.js build id not set"; exit 1; }
          ls -la
          touch .nojekyll
          echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b gh-pages && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Web app ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
